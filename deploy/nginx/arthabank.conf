# Production edge proxy for ArthaBank (nginx 1.25+).
# Terminates TLS, adds security headers, rate-limits sign-in, serves the built
# web app and proxies the API, WebSockets and SOAP to the Node.js API.

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream arthabank_api {
  server 127.0.0.1:4000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name bank.example.in;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name bank.example.in;

  ssl_certificate     /etc/letsencrypt/live/bank.example.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bank.example.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_stapling on;
  ssl_stapling_verify on;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' wss://bank.example.in; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  client_max_body_size 512k;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  root /var/www/arthabank;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /api/v1/auth/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://arthabank_api;
    include /etc/nginx/snippets/arthabank-proxy.conf;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://arthabank_api;
    include /etc/nginx/snippets/arthabank-proxy.conf;
  }

  location /socket.io/ {
    proxy_pass http://arthabank_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /soap/ {
    proxy_pass http://arthabank_api;
    include /etc/nginx/snippets/arthabank-proxy.conf;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

