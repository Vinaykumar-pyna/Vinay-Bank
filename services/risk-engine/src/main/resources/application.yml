server:
  port: ${RISK_ENGINE_PORT:8085}
  # Local development binds to loopback only; containers set RISK_ENGINE_BIND=0.0.0.0.
  address: ${RISK_ENGINE_BIND:127.0.0.1}
  shutdown: graceful

spring:
  application:
    name: vinaybank-risk-engine
  threads:
    virtual:
      enabled: true # Java 21 virtual threads for request handling

risk:
  # Shared secret with the core banking API (X-Api-Key header)
  api-key: ${RISK_ENGINE_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Vinay Bank risk engine
    version: 1.0.0
    rules-version: java-rules-1.0
