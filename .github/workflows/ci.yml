name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node.js (API, card switch, web app)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # mongodb-memory-server downloads the mongod binary on first use (e2e tests)
      - name: Cache the MongoDB binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-v1

      - name: Install (root, backend, frontend) and generate local secrets
        run: npm ci

      # Only what ships to production is gated; see docs/SECURITY.md for the
      # dev-tooling findings and why they are accepted.
      - name: Audit production dependencies (fails on high or critical)
        run: |
          npm --prefix backend audit --omit=dev --audit-level=high
          npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: |
          npm --prefix backend run test:cov
          npm --prefix frontend run test:cov

      - name: End-to-end tests with coverage (in-memory MongoDB replica set)
        run: npm --prefix backend run test:e2e:cov

      - name: Production builds (API, card switch, web app)
        run: npm run build

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            backend/coverage
            frontend/coverage
          if-no-files-found: ignore

  java:
    name: Java risk engine (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/risk-engine
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Through sh, so a checkout that lost the execute bit (a repository created
      # on Windows) still works; mvnw is also committed with mode 100755.
      - name: Test and package
        run: sh ./mvnw -B verify
